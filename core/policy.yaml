# Política de autonomía de Sentinela AML.
# La define el banco (regla de negocio). Cambiar un valor aquí cambia el comportamiento sin tocar código.

autonomia:
  # Por debajo de este riesgo el sistema SUGIERE descartar, pero igual lo confirma un humano.
  sugerir_descartar_si_riesgo_menor_a: 0.25
  # Por encima de este riesgo, descartar exige una segunda justificación.
  doble_justificacion_si_riesgo_mayor_a: 0.70
  # Acciones que ningún agente puede ejecutar: solo el rol humano "oficial_cumplimiento".
  acciones_prohibidas_a_agentes: [cerrar_alerta, descartar, escalar_ros, enviar_ros, contactar_cliente]
  # Roles humanos con permiso de decisión. El analista valida hallazgos y pregunta; el oficial firma.
  roles_con_decision: [oficial_cumplimiento]
  roles_con_reidentificacion: [oficial_cumplimiento]

# Triaje por confianza (diapositivas 5-6). Ninguna zona cierra sola: "cierre sugerido" lo aprueba un humano.
triaje:
  cierre_sugerido: {riesgo_max: 0.25, confianza_min: 0.75}
  escalamiento: {riesgo_min: 0.75}
  muestreo_qa_cierres: 0.10      # % de cierres sugeridos que igual van a revisión humana (control de calidad)

# "Entra un humano aunque el porcentaje sea alto si..." (diapositiva 6)
forzar_humano_si:
  desacuerdo_agentes: true       # abogado del diablo con mitigación >= 0.4 vs hallazgo de riesgo >= 0.6
  cliente_nuevo_meses: 6
  monto_mayor_a_usd: 100000      # pico de ingresos en 30 días
  pocas_transacciones: 5         # menos de N transacciones en la ventana
  sin_perfil_kyc: true
  patron_nunca_visto_percentil: 99   # modelo ML (agente_anomalia) sin ninguna regla activada

perfil:
  estudiante_max_mensual_usd: 13500   # ~ S/ 50,000 (ejemplo de la diapositiva 4)

# Umbrales del Registro de Operaciones (Res. SBS 2660-2015, art. 49). Verificar vigencia.
umbrales_registro:
  operacion_unica_usd: 10000
  multiples_mes_usd: 50000
  multiples_minimo_individual_usd: 1000

# Plazo para comunicar el ROS a la UIF-Perú desde que la operación se califica como sospechosa.
plazo_ros_horas: 24
# Conservación de expedientes (Ley 27693, art. 9.4).
conservacion_anios: 10

deteccion:
  # Estructuración: depósitos justo por debajo del umbral (ej. entre 85% y 100% del umbral).
  estructuracion_banda_inferior: 0.85
  estructuracion_min_operaciones: 3
  ventana_dias: 7
  fan_min_contrapartes: 6
  ciclo_max_longitud: 5
  pass_through_ratio: 0.8
  pitufeo_min_operaciones: 8
  concentracion_min_contrapartes: 4
  cambio_z: 3.0

# Tipo de cambio aproximado a USD por moneda de la alerta (SAML-D viene en GBP). Verificar antes de la demo.
fx_a_usd_por_moneda: {USD: 1.0, GBP: 1.27, EUR: 1.08, PEN: 0.27}
fx_a_usd: 1.0                  # se sobrescribe por caso según la moneda de la alerta

# Campos que NUNCA salen hacia el LLM ni a otros agentes (capa privacy de NANDA).
campos_privados: [nombre_cliente, documento_identidad, cuenta_real, direccion, telefono]

llm:
  proveedor: auto              # auto (Ollama si corre, si no OpenRouter) | ollama | openrouter | ninguno
  url: http://localhost:11434
  modelo: qwen2.5:3b           # Ollama local (CPU). Con GPU NVIDIA: qwen2.5:7b
  # OpenRouter (requiere OPENROUTER_API_KEY en el entorno o en .streamlit/secrets.toml).
  # Solo modelos GRATUITOS (:free): si uno está saturado (429) se prueba el siguiente.
  solo_modelos_gratis: true    # candado de costos: un modelo de pago en la lista se ignora
  modelos_openrouter:
    - nvidia/nemotron-3-super-120b-a12b:free   # ~12 s por llamada, buen español
    - google/gemma-4-31b-it:free
    - openrouter/free                          # enrutador gratuito de OpenRouter (último recurso)
  timeout_s: 45
  usar_cache: false            # demo 100% en vivo: cada razonamiento se genera en el momento

entrada_alertas: json          # adaptador: json | csv | api

# Ficha de fraccionamiento (8 parámetros, ventana de 30 días). Valores iniciales: calibrar con el banco.
fraccionamiento:
  cerca_umbral_banda: [0.80, 0.99]   # % del umbral de registro (US$ 10,000 convertido a la moneda de la alerta)
  cerca_umbral_min: 3                # peso 2
  depositantes_min: 4                # peso 2
  canales_mismo_dia_min: 3           # peso 1
  dias_consecutivos_min: 5           # peso 1
  montos_repetidos_min: 3            # peso 1
  relacion_ingreso_max: 3            # recibido > 3× ingreso mensual -> peso 2
  salida_rapida_min: 0.70            # > 70% sale en 48 h -> peso 1
  triaje: {revision: 3, critico: 6}  # 0-2 pasa · 3-5 revisión · 6+ crítico

# Modelo de anomalía (IsolationForest, sin etiquetas)
anomalia:
  percentil_alerta: 97
